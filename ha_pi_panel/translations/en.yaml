configuration:
  display_type:
    name: Display type
    description: OLED controller and size.
  display_i2c_address:
    name: I2C address
    description: Usually 0x3C, sometimes 0x3D.
  display_rotate:
    name: Rotation
    description: Rotate the picture by this many degrees.
  display_contrast:
    name: Contrast
    description: Brightness from 0 to 255.
  display_page_seconds:
    name: Seconds per page
    description: How long each page stays on screen.
  display_pages_json:
    name: Pages
    description: JSON list of pages. The add-on documentation explains the line format and tokens.
