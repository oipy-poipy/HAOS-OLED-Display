name: HAOS OLED Info display
slug: haos_oled_display
description: OLED status display for Home Assistant OS, intended for Raspberry Pi hosts.
version: 0.1.0
url: https://github.com/oipy-poipy/HAOS-OLED-Display.git
arch:
  - aarch64
startup: application
boot: auto
stage: experimental
init: false
homeassistant_api: true
hassio_api: true
devices:
  - /dev/i2c-1
options:
  display_type: ssd1306_128x64
  display_i2c_address: "0x3C"
  display_rotate: 0
  display_contrast: 128
  display_page_seconds: 6
  display_pages_json: >-
    [{"name":"System","lines":["#{hostname}\t{clock}","CPU\t{cpu_temp_c}°C","RAM\t{mem_percent}%","Disk\t{disk_percent}%"]},{"name":"Network","lines":["#Network\t{clock}","IP\t{ip}","Up\t{uptime_short}","Load\t{cpu_load_1m}%"]},{"name":"Home","lines":["#Home\t{clock}","Out. Temp\t{ha:sensor.balcony_temperature_sensor_temperature,weather.forecast_home@temperature}{ha:sensor.balcony_temperature_sensor_temperature@unit_of_measurement,weather.forecast_home@temperature_unit}","Out. Humid.\t{ha:sensor.balcony_temperature_sensor_humidity,weather.forecast_home@humidity}%","Out. Wind\t{ha:weather.forecast_home@wind_speed}{ha:weather.forecast_home@wind_speed_unit}"]}]
schema:
  display_type: list(ssd1306_128x64|ssd1306_128x32|sh1106_128x64)
  display_i2c_address: str
  display_rotate: list(0|90|180|270)
  display_contrast: int(0,255)
  display_page_seconds: int(1,300)
  display_pages_json: str
