name: HA Pi Panel
slug: ha_pi_panel
description: OLED status display for Home Assistant OS on Raspberry Pi.
version: 0.3.0
url: https://github.com/local/ha-pi-panel
arch:
  - aarch64
startup: application
boot: auto
stage: experimental
init: false
homeassistant_api: true
hassio_api: true
devices:
  - /dev/i2c-1
options:
  display_type: ssd1306_128x64
  display_i2c_address: "0x3C"
  display_rotate: 0
  display_contrast: 128
  display_page_seconds: 6
  display_pages_json: >-
    [{"name":"System","lines":["#{hostname}\t{clock}","CPU\t{cpu_temp_c}°C","RAM\t{mem_percent}%","Disk\t{disk_percent}%"]},{"name":"Network","lines":["#Network\t{clock}","IP\t{ip}","Up\t{uptime_short}","Load\t{cpu_load_1m}"]},{"name":"Home","lines":["#Home\t{clock}","Out\t{ha:sensor.outdoor_temperature,weather.forecast_home@temperature,weather.home@temperature|1°C}","Sky\t{ha:weather.forecast_home,weather.home}","Hum\t{ha:sensor.outdoor_humidity,weather.forecast_home@humidity|0%}","Wind\t{ha:weather.forecast_home@wind_speed,weather.home@wind_speed|0 km/h}"]}]
schema:
  display_type: list(ssd1306_128x64|ssd1306_128x32|sh1106_128x64)
  display_i2c_address: str
  display_rotate: list(0|90|180|270)
  display_contrast: int(0,255)
  display_page_seconds: int(1,300)
  display_pages_json: str
